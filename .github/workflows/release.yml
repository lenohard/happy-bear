name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # notarytool --key expects a p8 file path; decode the base64 secret into a file (mac only)
      - name: Prepare Apple API key
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/asc
          echo "${{ secrets.APPLE_API_KEY }}" | base64 -D > /tmp/asc/AuthKey_3474G52856.p8
          echo "APPLE_API_KEY=/tmp/asc/AuthKey_3474G52856.p8" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          BAIDU_CLIENT_ID: ${{ secrets.BAIDU_CLIENT_ID }}
          BAIDU_CLIENT_SECRET: ${{ secrets.BAIDU_CLIENT_SECRET }}
          BAIDU_REDIRECT_URI: ${{ secrets.BAIDU_REDIRECT_URI }}
          BAIDU_SCOPE: ${{ secrets.BAIDU_SCOPE }}
          # Developer ID signing (ignored on non-mac runners)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization via App Store Connect API key (path set by Prepare step)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build && npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "PolarBear ${{ github.ref_name }}" \
            --generate-notes
          gh release upload "${{ github.ref_name }}" dist/* --clobber
