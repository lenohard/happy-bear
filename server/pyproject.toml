[project]
name = "audiobook-remote-jobs"
version = "0.1.0"
description = "Remote jobs server for Audiobook Player (STT/TTS/AI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.5.0",
  "python-multipart>=0.0.20",
  "httpx>=0.27.0",
  "requests>=2.32.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.3",
  "python-dotenv>=1.2.2",
  "soniox>=1.0.0",
]

[tool.uv]
package = false
