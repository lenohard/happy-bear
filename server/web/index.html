<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1116">
<meta name="description" content="PolarBear 有声书网页客户端">
<title>PolarBear</title>
<link rel="stylesheet" href="./styles.css">
<script>
/* Installed before app.js is parsed, so a broken or mismatched app.js still
   shows a readable message instead of a blank page. */
(function () {
  function show(message) {
    var app = document.getElementById('app');
    if (app) app.hidden = false;
    var root = document.getElementById('view-root');
    if (!root) return;
    var text = document.createElement('div');
    text.className = 'fatal-error';
    var title = document.createElement('h1');
    title.textContent = '页面加载失败';
    var detail = document.createElement('p');
    detail.textContent = message;
    var hint = document.createElement('p');
    hint.className = 'fatal-hint';
    hint.textContent = '如果刚更新过服务，请强制刷新页面（Safari：长按刷新按钮；桌面：Ctrl/Cmd + Shift + R）。';
    text.appendChild(title);
    text.appendChild(detail);
    text.appendChild(hint);
    root.appendChild(text);
  }
  window.addEventListener('error', function (event) {
    show((event.error && event.error.message) || event.message || '脚本执行出错。');
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    show((reason && reason.message) || String(reason || '加载失败。'));
  });
})();
</script>
</head>
<body>

<div id="app" class="app">
  <header class="topbar">
    <button id="menu-button" class="icon-btn" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <form id="search-form" class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="search-input" type="search" placeholder="搜索合集、作者或曲目" aria-label="搜索合集、作者或曲目"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </form>
  </header>

  <div id="scrim" class="scrim" hidden></div>

  <aside id="sidebar" class="sidebar" aria-label="主导航">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🐻‍❄️</span>
        <span class="brand-text"><strong>PolarBear</strong><small>WEB</small></span>
      </div>
      <button id="drawer-close" class="icon-btn drawer-close" type="button" aria-label="关闭导航菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <nav class="nav" id="primary-nav" aria-label="浏览">
      <button class="nav-item" type="button" data-action="nav" data-href="#/library" data-route="#/library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h5v14H4zM10.5 5h4v14h-4zM16.4 6l3.7.9-2.9 12.3-3.7-.9z"/></svg>
        <span class="nav-text">书库</span>
      </button>
      <button class="nav-item" type="button" data-action="nav" data-href="#/continue" data-route="#/continue">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3.2 2"/></svg>
        <span class="nav-text">继续收听</span>
      </button>
      <button class="nav-item" type="button" data-action="nav" data-href="#/favorites" data-route="#/favorites">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2l2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4-3.9 5.6-.8z"/></svg>
        <span class="nav-text">收藏</span>
      </button>
      <button class="nav-item" type="button" data-action="nav" data-href="#/archived" data-route="#/archived">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.2"/><path d="M5 8v11h14V8M10 12h4"/></svg>
        <span class="nav-text">归档</span>
      </button>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-title"><span>文件夹</span><small id="folder-count"></small></div>
      <div id="folder-list" class="folder-list"></div>
    </div>
  </aside>

  <main class="main">
    <div id="view-root" class="view" tabindex="-1"></div>
    <div id="player" class="player" hidden></div>
    <footer id="status-strip" class="status-strip"></footer>
  </main>
</div>

<div id="modal-root" class="modal-root" hidden></div>
<audio id="audio" preload="metadata"></audio>

<script src="./app.js"></script>
</body>
</html>
