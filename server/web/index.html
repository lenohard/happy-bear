<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1116">
<meta name="description" content="PolarBear 有声书网页客户端">
<title>PolarBear</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 令牌闸门：没有令牌时显示，且不发起任何 API 请求 -->
<div id="token-screen" class="token-screen" hidden>
  <form id="token-form" class="token-card" autocomplete="off">
    <div class="token-logo" aria-hidden="true">🐻‍❄️</div>
    <h1>PolarBear</h1>
    <p class="token-sub">输入访问令牌以连接本机书库。</p>
    <label class="token-label" for="token-input">访问令牌</label>
    <input id="token-input" class="token-input" type="password" name="token" placeholder="Bearer token"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <p id="token-error" class="token-error" role="alert" hidden></p>
    <button id="token-submit" class="btn btn-primary token-submit" type="submit">连接</button>
    <p class="token-hint">令牌保存在本机 localStorage（键名 <code>polarbear-token</code>），仅用于同源 API 请求。</p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="menu-button" class="icon-btn" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <form id="search-form" class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input id="search-input" type="search" placeholder="搜索合集、作者或曲目" aria-label="搜索合集、作者或曲目"
             autocomplete="off" autocapitalize="off" spellcheck="false">
    </form>
    <button id="token-button" class="icon-btn" type="button" aria-label="更换访问令牌" title="更换访问令牌">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15 12v2"/></svg>
    </button>
  </header>

  <div id="scrim" class="scrim" hidden></div>

  <aside id="sidebar" class="sidebar" aria-label="主导航">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🐻‍❄️</span>
        <span class="brand-text"><strong>PolarBear</strong><small>WEB</small></span>
      </div>
      <button id="drawer-close" class="icon-btn drawer-close" type="button" aria-label="关闭导航菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <nav class="nav" id="primary-nav" aria-label="浏览">
      <button class="nav-item" type="button" data-route="#/library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h5v14H4zM10.5 5h4v14h-4zM16.4 6l3.7.9-2.9 12.3-3.7-.9z"/></svg>
        <span class="nav-text">书库</span>
      </button>
      <button class="nav-item" type="button" data-route="#/continue">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3.2 2"/></svg>
        <span class="nav-text">继续收听</span>
      </button>
      <button class="nav-item" type="button" data-route="#/favorites">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2l2.5 5.1 5.6.8-4 3.9 1 5.6-5.1-2.7-5.1 2.7 1-5.6-4-3.9 5.6-.8z"/></svg>
        <span class="nav-text">收藏</span>
      </button>
      <button class="nav-item" type="button" data-route="#/archived">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1.2"/><path d="M5 8v11h14V8M10 12h4"/></svg>
        <span class="nav-text">归档</span>
      </button>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-title"><span>文件夹</span><small id="folder-count"></small></div>
      <div id="folder-list" class="folder-list"></div>
    </div>
  </aside>

  <main class="main">
    <div id="view-root" class="view" tabindex="-1"></div>
    <div id="player" class="player" hidden></div>
    <footer id="status-strip" class="status-strip"></footer>
  </main>
</div>

<div id="modal-root" class="modal-root" hidden></div>
<audio id="audio" preload="metadata"></audio>

<script src="./app.js"></script>
</body>
</html>
